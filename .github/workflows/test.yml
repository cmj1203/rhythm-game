name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: bun test
      - uses: astral-sh/setup-uv@v7
      # tools/ 의 채보 도구 시험. 큰 분석 의존성(numpy, librosa 등)은 tools/conftest.py 가 가짜로 채우므로 pytest 만 받는다.
      - name: pytest tools
        run: uv run --no-project --python 3.13 --with pytest==9.2.0 pytest tools
